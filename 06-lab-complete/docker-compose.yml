# ============================================================
# Agent + Redis bằng một lệnh (tiêu chí 2):
#   docker compose -p k5-day14-final up -d --build
#   curl http://localhost:8000/health
# Secret (AGENT_API_KEY) đặt trong file .env (không commit) — xem .env.example.
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: staging
      PORT: "8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
