# Railway — deploy bằng Dockerfile trong thư mục này (tiêu chí 12)
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên dashboard / `railway variables`,
# không ghi vào file này. PORT do Railway cấp, CMD trong Dockerfile đã đọc ${PORT}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
